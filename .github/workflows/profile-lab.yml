name: Profile Lab Runtime

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/profile-lab.yml'

  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Profile Lab
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate graph model
        run: python scripts/validate_graph.py

      - name: Sync public GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: chinmaygit-lab
          PROFILE_WORKSTREAM: Building ConformalGuard reliability tooling and release quality
        run: python scripts/sync_github.py

      - name: Verify site output
        shell: bash
        run: |
          echo "Checking generated site..."
          test -d site
          test -f site/index.html
          echo "Site output is ready:"
          find site -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Profile Lab
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
